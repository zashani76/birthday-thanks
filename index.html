<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>תודה רבה!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E9;
    --ink:#2A1E3D;
    --pink:#FF4D8D;
    --yellow:#FFC93D;
    --turquoise:#2FD9C4;
    --purple:#7B4FFF;
    --card:#FFFFFF;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ---------- confetti ---------- */
  #confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
  }
  .confetti-piece{
    position:absolute;
    top:-10vh;
    opacity:.9;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(115vh) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .confetti-piece{ animation:none; display:none; }
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    z-index:2;
    min-height:78vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vh 6vw 6vh;
    background:radial-gradient(circle at 30% 20%, rgba(255,201,61,.35), transparent 55%),
               radial-gradient(circle at 80% 75%, rgba(47,217,196,.3), transparent 50%),
               var(--cream);
  }

  .eyebrow{
    font-size:.95rem;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--purple);
    background:rgba(123,79,255,.1);
    padding:.4em 1em;
    border-radius:999px;
    margin-bottom:1.4rem;
  }

  h1{
    font-family:'Secular One', sans-serif;
    font-weight:400;
    font-size:clamp(2.6rem, 13vw, 4.6rem);
    line-height:1.05;
    background:linear-gradient(95deg, var(--pink) 10%, var(--purple) 55%, var(--turquoise) 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:.6rem;
  }

  .heart{
    display:inline-block;
    animation:beat 1.3s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.22); }
  }

  .sub{
    font-size:clamp(1.05rem, 4vw, 1.3rem);
    font-weight:400;
    max-width:32ch;
    color:var(--ink);
    opacity:.85;
  }

  .scroll-cue{
    margin-top:3rem;
    font-size:1.6rem;
    animation:bob 1.8s ease-in-out infinite;
    opacity:.6;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(10px); }
  }

  /* ---------- gallery ---------- */
  .gallery-section{
    position:relative;
    z-index:2;
    padding:2rem 6vw 6rem;
  }

  .gallery-title{
    font-family:'Secular One', sans-serif;
    font-size:clamp(1.6rem, 6vw, 2.2rem);
    text-align:center;
    color:var(--purple);
    margin-bottom:2.2rem;
  }

  .photo-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1.6rem 1.1rem;
    max-width:640px;
    margin:0 auto;
  }

  .photo-card{
    position:relative;
    background:var(--card);
    padding:.6rem .6rem 1.4rem;
    border-radius:6px;
    box-shadow:0 10px 22px rgba(42,30,61,.16);
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .photo-card:nth-child(4n+1){ transform:rotate(-4deg); }
  .photo-card:nth-child(4n+2){ transform:rotate(3deg); }
  .photo-card:nth-child(4n+3){ transform:rotate(2deg); }
  .photo-card:nth-child(4n+4){ transform:rotate(-3deg); }
  .photo-card:active{ transform:scale(.96) rotate(0deg); }

  .photo-card::before{
    content:"";
    position:absolute;
    top:-10px;
    right:calc(50% - 24px);
    width:48px;
    height:20px;
    background:rgba(255,201,61,.85);
    transform:rotate(-6deg);
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }

  .photo-card .frame{
    width:100%;
    aspect-ratio:1/1;
    border-radius:2px;
    overflow:hidden;
    background:#eee;
  }

  .photo-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .placeholder{
    display:none;
    width:100%;
    height:100%;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:.3rem;
    font-size:1.8rem;
    color:#fff;
  }
  .photo-card:nth-child(6n+1) .placeholder{ background:linear-gradient(135deg,var(--pink),var(--purple)); }
  .photo-card:nth-child(6n+2) .placeholder{ background:linear-gradient(135deg,var(--yellow),var(--pink)); }
  .photo-card:nth-child(6n+3) .placeholder{ background:linear-gradient(135deg,var(--turquoise),var(--purple)); }
  .photo-card:nth-child(6n+4) .placeholder{ background:linear-gradient(135deg,var(--purple),var(--turquoise)); }
  .photo-card:nth-child(6n+5) .placeholder{ background:linear-gradient(135deg,var(--pink),var(--yellow)); }
  .photo-card:nth-child(6n+6) .placeholder{ background:linear-gradient(135deg,var(--turquoise),var(--yellow)); }
  .placeholder span{ font-family:'Heebo',sans-serif; font-size:.85rem; font-weight:700; opacity:.9; }

  .caption{
    display:block;
    text-align:center;
    font-size:.85rem;
    color:var(--ink);
    opacity:.55;
    margin-top:.5rem;
    font-family:'Heebo', sans-serif;
  }

  .hint{
    text-align:center;
    max-width:36ch;
    margin:2.4rem auto 0;
    font-size:.9rem;
    color:var(--ink);
    opacity:.5;
  }

  /* ---------- footer ---------- */
  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:3rem 6vw 4rem;
    font-family:'Secular One', sans-serif;
    font-size:1.4rem;
    color:var(--purple);
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,12,32,.94);
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    touch-action:none;
  }
  .lightbox.open{ display:flex; }

  .lightbox-stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3.6rem;
  }

  .lightbox img{
    max-width:100%;
    max-height:78vh;
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    user-select:none;
    -webkit-user-drag:none;
  }

  .lightbox .placeholder{
    display:flex;
    width:min(80vw, 420px);
    aspect-ratio:1/1;
    border-radius:6px;
  }

  .lb-close, .lb-arrow{
    position:absolute;
    background:rgba(255,255,255,.12);
    border:none;
    color:#fff;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:1.3rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s ease;
  }
  .lb-close:hover, .lb-arrow:hover{ background:rgba(255,255,255,.25); }

  .lb-close{ top:1.2rem; left:1.2rem; }
  .lb-arrow.prev{ right:.6rem; top:50%; transform:translateY(-50%); }
  .lb-arrow.next{ left:.6rem; top:50%; transform:translateY(-50%); }

  .lb-counter{
    position:absolute;
    bottom:1.4rem;
    left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.7);
    font-size:.9rem;
    font-family:'Heebo', sans-serif;
  }

  @media (max-width:380px){
    .photo-grid{ gap:1.2rem .8rem; }
    .lightbox-stage{ padding:0 2.6rem; }
  }
</style>
</head>
<body>

<div id="confetti"></div>

<section class="hero">
  <span class="eyebrow">מהלב אל הלב</span>
  <h1>תודה רבה !! <span class="heart">❤️</span></h1>
  <p class="sub">היה כיף מטורף לחגוג איתכם. הנה כמה רגעים מהערב הזה ✨</p>
  <div class="scroll-cue">⌄</div>
</section>

<section class="gallery-section" id="gallery">
  <h2 class="gallery-title">רגעים מהערב 📸</h2>

  <div class="photo-grid" id="photo-grid">
    <!-- Each card: replace src="photos/1.jpg" with your real photo files.
         If a photo file is missing, a colorful placeholder shows instead. -->
    <div class="photo-card" data-index="0">
      <div class="frame">
        <img src="photos/1.jpg" alt="תמונה 1" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder">📷<span>1</span></div>
      </div>
    </div>
    <div class="photo-card" data-index="1">
      <div class="frame">
        <img src="photos/2.jpg" alt="תמונה 2" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder">🎉<span>2</span></div>
      </div>
    </div>
    <div class="photo-card" data-index="2">
      <div class="frame">
        <img src="photos/3.jpg" alt="תמונה 3" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder">🎂<span>3</span></div>
      </div>
    </div>
    <div class="photo-card" data-index="3">
      <div class="frame">
        <img src="photos/4.jpg" alt="תמונה 4" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder">🥳<span>4</span></div>
      </div>
    </div>
    <div class="photo-card" data-index="4">
      <div class="frame">
        <img src="photos/5.jpg" alt="תמונה 5" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder">💃<span>5</span></div>
      </div>
    </div>
    <div class="photo-card" data-index="5">
      <div class="frame">
        <img src="photos/6.jpg" alt="תמונה 6" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder">🎈<span>6</span></div>
      </div>
    </div>
  </div>

  <p class="hint">לחצו על תמונה כדי לראות אותה בגדול, ותנו לאצבע (או לחצים) לגלול בין התמונות</p>
</section>

<footer>שוב, תודה על הכל 💛</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-stage">
    <button class="lb-close" id="lb-close" aria-label="סגירה">✕</button>
    <button class="lb-arrow prev" id="lb-prev" aria-label="הקודם">›</button>
    <img id="lb-img" src="" alt="" style="display:none;">
    <div class="placeholder" id="lb-placeholder"></div>
    <button class="lb-arrow next" id="lb-next" aria-label="הבא">‹</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>
</div>

<script>
  // ---------- confetti generator ----------
  (function(){
    var colors = ['#FF4D8D', '#FFC93D', '#2FD9C4', '#7B4FFF'];
    var container = document.getElementById('confetti');
    var count = window.innerWidth < 500 ? 26 : 40;
    for (var i = 0; i < count; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var size = 6 + Math.random() * 8;
      var isCircle = Math.random() > 0.5;
      piece.style.width = size + 'px';
      piece.style.height = (isCircle ? size : size * 1.6) + 'px';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = isCircle ? '50%' : '2px';
      piece.style.animationDuration = (6 + Math.random() * 6) + 's';
      piece.style.animationDelay = (Math.random() * 8) + 's';
      container.appendChild(piece);
    }
  })();

  // ---------- lightbox slideshow ----------
  (function(){
    var cards = Array.prototype.slice.call(document.querySelectorAll('.photo-card'));
    var lightbox = document.getElementById('lightbox');
    var lbImg = document.getElementById('lb-img');
    var lbPlaceholder = document.getElementById('lb-placeholder');
    var lbCounter = document.getElementById('lb-counter');
    var current = 0;

    function slideData(index){
      var card = cards[index];
      var img = card.querySelector('img');
      var placeholder = card.querySelector('.placeholder');
      var visible = img.style.display !== 'none';
      return {
        src: img.getAttribute('src'),
        alt: img.getAttribute('alt'),
        visible: visible,
        placeholderHTML: placeholder.innerHTML,
        placeholderBG: getComputedStyle(placeholder).backgroundImage
      };
    }

    function render(index){
      current = (index + cards.length) % cards.length;
      var data = slideData(current);
      if (data.visible) {
        lbImg.src = data.src;
        lbImg.alt = data.alt;
        lbImg.style.display = 'block';
        lbPlaceholder.style.display = 'none';
      } else {
        lbImg.style.display = 'none';
        lbPlaceholder.style.display = 'flex';
        lbPlaceholder.innerHTML = data.placeholderHTML;
        lbPlaceholder.style.backgroundImage = data.placeholderBG;
      }
      lbCounter.textContent = (current + 1) + ' / ' + cards.length;
    }

    function open(index){
      render(index);
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close(){
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    cards.forEach(function(card){
      card.addEventListener('click', function(){
        open(parseInt(card.getAttribute('data-index'), 10));
      });
    });

    document.getElementById('lb-close').addEventListener('click', close);
    lightbox.addEventListener('click', function(e){
      if (e.target === lightbox) close();
    });

    // RTL-aware arrows: "next" (‹, left side) moves forward, "prev" (›, right side) moves back
    document.getElementById('lb-next').addEventListener('click', function(){ render(current + 1); });
    document.getElementById('lb-prev').addEventListener('click', function(){ render(current - 1); });

    document.addEventListener('keydown', function(e){
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') render(current + 1);
      if (e.key === 'ArrowRight') render(current - 1);
    });

    // swipe support
    var touchStartX = null;
    lightbox.addEventListener('touchstart', function(e){
      touchStartX = e.touches[0].clientX;
    }, {passive:true});
    lightbox.addEventListener('touchend', function(e){
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) {
        if (dx < 0) render(current + 1); // swipe left -> next
        else render(current - 1);        // swipe right -> prev
      }
      touchStartX = null;
    }, {passive:true});
  })();
</script>

</body>
</html>
